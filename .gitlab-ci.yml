image: mcr.microsoft.com/dotnet/sdk:10

# God, I hate working with CI/CD.

# Note to self, do not ever force push while working on this again.
# You're just going to break branches again.

variables:
  NUGET_PACKAGES_DIRECTORY: '.nuget'
  BLAM_VARIANTS: "HR H3 ODST H2AMP H4"

cache:
  key: "$CI_JOB_STAGE-$CI_COMMIT_REF_SLUG"
  paths:
    - .nuget/packages
    - '**/obj/project.assets.json'
    - '**/obj/*.csproj.nuget.*'

stages:
  - publish
  - release

publish:
  stage: publish
  image: mcr.microsoft.com/dotnet/sdk:8.0

  parallel:
    matrix:
      - BLAM_VARIANT: ["HR"]

  script:
    - VERSION=$(dotnet msbuild Huragok.CLI/CLI.csproj -getProperty:VersionPrefix)
    - echo "VERSION=$VERSION" > version.env
    - FILE="Huragok-$VERSION-$BLAM_VARIANT.zip"
    - PACKAGE_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/Huragok/$VERSION/$FILE"
    - echo "PACKAGE_URL=$PACKAGE_URL" >> version.env

    - ls
    
    - dotnet restore -r win-x64 --packages $NUGET_PACKAGES_DIRECTORY
    - dotnet publish -c Release -r win-x64 -o publish-$BLAM_VARIANT -p:BlamVariant=$BLAM_VARIANT --no-restore --no-self-contained Huragok.CLI/CLI.csproj

    - apt-get update && apt-get install -y zip curl
    - cd publish-$BLAM_VARIANT
    - zip -r ../Huragok-$VERSION-$BLAM_VARIANT.zip .
    - cd ..

    - echo "VERSION=$VERSION"
    - echo "BLAM_VARIANT=$BLAM_VARIANT"
    - echo "FILE=Huragok-$VERSION-$BLAM_VARIANT.zip"
    - ls -lah

    - |
      echo "Checking if package already exists..."

      HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --header "JOB-TOKEN: $CI_JOB_TOKEN" "$PACKAGE_URL")

      if [ "$HTTP_STATUS" = "200" ]; then
        echo "Package already exists. Skipping upload."
      else
        echo "Package does not exist. Uploading..."
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "Huragok-$VERSION-$BLAM_VARIANT.zip" "$PACKAGE_URL"
      fi

  artifacts:
    reports:
      dotenv: version.env
    paths:
      - Huragok-*.zip

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: publish
      artifacts: true

  before_script: []

  script:
    - apk add --no-cache jq
    - apk add --no-cache curl
    - jq --version

    - |
      CHANGELOG=$(
        awk -v version=$VERSION '
          /^## / {
              gsub(/\r/, "")
          }

          $0 == "## " version {
              capture=1
              next
          }

          /^## / && capture {
              exit
          }

          capture
        ' CHANGELOG.md
      )

      echo ${CHANGELOG:=No changelog provided.}

      # Create the release on GitLab
      release-cli create \
        --tag-name "v$VERSION" \
        --name "Huragok v$VERSION" \
        --description "${CHANGELOG}" \
        --assets-link "{\"name\":\"Huragok version $VERSION, for Halo Reach\",\"url\":\"$PACKAGE_URL\"}" || echo "Release already exists or submission failed."

      # Create on GitHub
    - |
      GH_RELEASE_API_RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
        -H "Authorization: Bearer $GITHUB_RELEASE_KEY" \
        -H "Accept: application/vnd.github+json" \
        "https://api.github.com/repos/ManiaVali/huragok/releases/tags/v$VERSION"
      )

      if [ "$GH_RELEASE_API_RESPONSE_CODE" -eq 200 ]; then
        RELEASE_EXISTS=true
      else
        RELEASE_EXISTS=false
      fi

      if [ "$RELEASE_EXISTS" == "true" ]; then
        echo "Not pushing release to GitHub; seems to already exist for tag v$VERSION"
        exit 0
      fi

      HEADER="### Changelog"
      FOOTER="##### Created automatically by GitLab in pipeline #$CI_PIPELINE_ID"
      payload=$(jq -n \
      --arg tag "v$VERSION" \
      --arg name "Huragok v$VERSION" \
      --arg header "$HEADER" \
      --arg footer "$FOOTER" \
      --arg changelog "$CHANGELOG" \
      --arg target "$CI_COMMIT_BRANCH" \
      '{
        tag_name: $tag,
        name: $name,
        body: ($header + "\n\n" + $changelog + "\n\n" + $footer),
        target_commitish: $target,
        draft: false,
        prerelease: true
      }')

      RELEASE_RESPONSE=$(curl -s -X POST \
        -H "Authorization: Bearer $GITHUB_RELEASE_KEY" \
        -H "Accept: application/vnd.github+json" \
        -H "Content-Type: application/json" \
        https://api.github.com/repos/ManiaVali/huragok/releases \
        -d "$payload"
      )

      UPLOAD_URL=$(echo "$RELEASE_RESPONSE" | jq -r '.upload_url' | sed 's/{?name,label}//')

      if [ "$UPLOAD_URL" = "null" ] || [ -z "$UPLOAD_URL" ]; then
        echo "Failed to get upload URL from GitHub release response"
        echo "$RELEASE_RESPONSE"
        exit 1
      fi

      ZIP_FILES=Huragok-$VERSION-*.zip

      for ZIP_FILE in $ZIP_FILES; do
        echo "Uploading $ZIP_FILE to GitHub ..."
        curl -L -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $GITHUB_RELEASE_KEY" \
          -H "X-GitHub-Api-Version: 2026-03-10" \
          -H "Content-Type: application/octet-stream" \
          "$UPLOAD_URL?name=$ZIP_FILE" \
          --data-binary "@$ZIP_FILE"
      done

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'